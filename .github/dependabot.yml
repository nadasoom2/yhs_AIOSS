version: 2

updates:
  # npm Dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    allow:
      - dependency-type: "all"
    reviewers:
      - "yourusername"
    assignees:
      - "yourusername"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "⬆️ chore(deps)"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    # Auto-merge minor/patch updates
    auto-merge:
      enabled: true
    # Grouping strategy
    groups:
      development:
        dependency-types:
          - "dev"
        update-types:
          - "minor"
          - "patch"
      production:
        dependency-types:
          - "production"
        update-types:
          - "patch"

  # Python Dependencies (if using pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "UTC"
    allow:
      - dependency-type: "all"
    reviewers:
      - "yourusername"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "⬆️ chore(python-deps)"
    groups:
      dev-dependencies:
        dependency-types:
          - "dev"
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        dependency-types:
          - "production"
        update-types:
          - "patch"

  # Docker Base Images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    reviewers:
      - "yourusername"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "⬆️ chore(docker)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "UTC"
    reviewers:
      - "yourusername"
    labels:
      - "ci/cd"
      - "github-actions"
    commit-message:
      prefix: "⬆️ ci(actions)"
    # Auto-merge patch updates for actions
    auto-merge:
      enabled: true

# Vulnerability alerts
vulnerability-alerts:
  enabled: true
  auto-fix: true
