name: Frontend — Unit Tests & Coverage

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/frontend-test.yml'
  workflow_dispatch:

concurrency:
  group: frontend-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest (Coverage ≥ 80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/app/package-lock.json

      - name: Install dependencies
        working-directory: front/app
        run: npm ci

      # 커버리지 임계값 미달 시 CI 실패 (vite.config.js thresholds 참고)
      - name: Run unit tests with coverage
        working-directory: front/app
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: front/app/coverage
          retention-days: 14

      - name: Write coverage summary
        if: always()
        run: |
          echo "## 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 임계값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lines | ≥ 80% |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions | ≥ 80% |" >> $GITHUB_STEP_SUMMARY
          echo "| Branches | ≥ 80% |" >> $GITHUB_STEP_SUMMARY
          echo "| Statements | ≥ 80% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "커버리지 상세 보고서는 Artifacts → \`coverage-${{ github.sha }}\` 확인" >> $GITHUB_STEP_SUMMARY
