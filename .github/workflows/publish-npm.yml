name: Publish npm Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag name (e.g. v1.0.1) - when provided, release will be created for this tag'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'

      - name: Set package.json version from tag or input
        id: release_version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${DISPATCH_TAG}" ]; then
            TAG_NAME=${DISPATCH_TAG}
            VERSION=${DISPATCH_TAG#v}
          else
            echo "No release tag detected; stopping publish workflow."
            exit 1
          fi

          echo "Detected tag: $TAG_NAME"
          echo "Detected version: $VERSION"
          npm pkg set version="$VERSION"
          node -e "console.log(require('./package.json').version)"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test || echo "No tests defined"

      - name: Build package
        run: npm run build || echo "No build script defined"

      - name: Create package tarball (for evidence)
        run: |
          npm pack
        shell: bash

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: '*.tgz'

      - name: Publish to npm
        run: |
          set -o pipefail || true
          npm publish --registry=https://npm.pkg.github.com 2>&1 | tee publish-log.txt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Upload publish log
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: publish-log.txt

      - name: Create GitHub Release
        if: steps.release_version.outputs.tag_name != ''
        uses: softprops/action-gh-release@v1
        with:
          files: |
            package.json
            README.md
          generate_release_notes: true
          tag_name: ${{ steps.release_version.outputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
