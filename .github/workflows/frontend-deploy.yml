name: Frontend – Build & Deploy (Netlify)

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - 'netlify.toml'
  pull_request:
    branches: [main]
    paths:
      - 'front/**'
      - 'netlify.toml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1단계: 빌드 & 린트 ──────────────────────────────────────────
  build:
    name: Build React App
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{ steps.build.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/app/package-lock.json

      - name: Install dependencies
        working-directory: front/app
        run: npm ci --frozen-lockfile

      - name: Lint
        working-directory: front/app
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build
        id: build
        working-directory: front/app
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: front/app/dist
          retention-days: 7

  # ── 2단계: Netlify 배포 (PR 프리뷰 / 프로덕션) ──────────────────
  deploy:
    name: Deploy to Netlify
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # PR 코멘트 작성용

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: front/app/dist

      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './front/app/dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: |
            ${{ github.event_name == 'pull_request'
              && format('PR #{0} – {1}', github.event.number, github.event.pull_request.title)
              || format('Deploy {0} @ {1}', github.ref_name, github.sha) }}
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
          alias: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Write deploy summary
        run: |
          echo "## Frontend Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "**Preview URL:** ${{ steps.netlify.outputs.deploy-url }}" >> $GITHUB_STEP_SUMMARY
            echo "> PR #${{ github.event.number }} — ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Production URL:** ${{ steps.netlify.outputs.deploy-url }}" >> $GITHUB_STEP_SUMMARY
          fi

  # ── 3단계: Docker 이미지 빌드 (GHCR 푸시) ─────────────────────
  docker-frontend:
    name: Build Frontend Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front/app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
